name: holycode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  holycode:
    if: |
      contains(github.event.comment.body, ' /hc') ||
      startsWith(github.event.comment.body, '/hc') ||
      contains(github.event.comment.body, ' /holycode') ||
      startsWith(github.event.comment.body, '/holycode')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Run HolyCode
        uses: crusadesoft/holycode/github@latest
        env:
          HOLYCODE_API_KEY: ${{ secrets.HOLYCODE_API_KEY }}
          HOLYCODE_PERMISSION: '{"bash": "deny"}'
        with:
          model: opencode/claude-opus-4-5
